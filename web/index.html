<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhiloFTP · 登录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="aurora"></div>
<div class="auth-wrap">
  <form class="auth-card glass" id="f" autocomplete="off">
    <div class="brand">
      <div class="logo">⬡</div>
      <h1>Philo<b>FTP</b></h1>
      <p>内网 FTP 控制中枢</p>
    </div>
    <div class="alert" id="alert"></div>
    <div class="field">
      <label>用户名</label>
      <input class="input" id="u" placeholder="例如 admin" autocomplete="username" autofocus>
      <div class="hint" id="uHint">请输入用户名，例如 admin</div>
    </div>
    <div class="field">
      <label>密码</label>
      <div class="input-wrap">
        <input class="input" id="p" type="password" placeholder="输入登录密码" autocomplete="current-password">
        <span class="toggle" id="t">显示</span>
      </div>
      <div class="hint" id="pHint">请输入登录密码</div>
    </div>
    <button class="btn btn-primary" id="b" type="submit">登 录</button>
    <div class="auth-hint"><span class="auth-hint-key">默认管理员</span> 账号：<b>admin</b>　密码：<b>admin123</b>（首次登录后请尽快修改）</div>
    <div class="auth-link" id="regLink">没有账户？<a href="/register">立即注册</a></div>
  </form>
  <div class="access-card glass">
    <div class="access-head">📡 局域网访问</div>
    <div class="access-body">
      <div class="access-qr" id="accessQR"><span class="access-qr-placeholder">加载二维码…</span></div>
      <div class="access-info">
        <div class="access-row"><span class="access-label">IP 地址</span><code class="mono" id="accessIP">—</code></div>
        <div class="access-row"><span class="access-label">主机名</span><code class="mono" id="accessHost">—</code></div>
        <div class="access-row"><span class="access-label">Web 端口</span><code class="mono" id="accessPort">—</code></div>
      </div>
    </div>
    <div class="access-links">
      <a class="access-link" id="accessLinkIP" href="#" target="_blank" rel="noopener">🔗 IP 访问</a>
      <a class="access-link" id="accessLinkMdns" href="#" target="_blank" rel="noopener">🌐 mDNS 访问</a>
    </div>
    <div class="access-tip">同一局域网内的设备，扫码或点击上方链接即可访问本管理端；mDNS 主机名 <b>philoftp.local</b> 供支持该协议的设备使用。</div>
  </div>
</div>
<script src="/assets/auth.js"></script>
<script>initLogin();</script>
<noscript style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:#070a12;font-family:sans-serif">请启用 JavaScript</noscript>
</body>
</html>
